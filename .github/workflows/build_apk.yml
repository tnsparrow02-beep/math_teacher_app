name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Les fichiers .dart sont a la racine du depot: on les range dans lib/,
      # et on cree le son de succes (success.wav) automatiquement.
      - name: Prepare project folders
        run: |
          mkdir -p lib assets/sounds assets/google_fonts
          mv -f ./*.dart lib/ 2>/dev/null || true
          echo "Cairo fonts (optional)" > assets/google_fonts/README.txt
          python3 - <<'PY'
          import wave, struct, math
          sr=44100; n=int(sr*1.5)
          notes=[(523.25,0.0),(659.25,0.11),(783.99,0.22),(1046.5,0.33)]
          s=[0.0]*n
          for f,st in notes:
              o=int(st*sr)
              for i in range(o,n):
                  t=(i-o)/sr
                  env=math.exp(-3.0*t)*min(1.0,t/0.004)
                  s[i]+=(math.sin(2*math.pi*f*t)+0.3*math.sin(4*math.pi*f*t)+0.1*math.sin(6*math.pi*f*t))*env
          k=0.85/max(abs(x) for x in s)
          w=wave.open('assets/sounds/success.wav','wb')
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
          w.writeframes(b''.join(struct.pack('<h',int(x*k*32767)) for x in s))
          w.close()
          PY

      - name: Generate Android scaffolding
        run: |
          if [ ! -d android ]; then
            mkdir /tmp/keep && cp -r pubspec.yaml lib assets /tmp/keep/
            flutter create --org com.teacher --project-name math_teacher --platforms android .
            cp /tmp/keep/pubspec.yaml pubspec.yaml
            rm -rf lib assets && cp -r /tmp/keep/lib lib && cp -r /tmp/keep/assets assets
            rm -rf test
          fi

      - name: Patch AndroidManifest for TTS
        run: |
          F=android/app/src/main/AndroidManifest.xml
          if ! grep -q "TTS_SERVICE" "$F"; then
            sed -i 's#<application#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n    <application#' "$F"
          fi
          sed -i 's#android:label="[^"]*"#android:label="Math Teacher"#' "$F"

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: math-teacher-apk
          path: build/app/outputs/flutter-apk/app-release.apk
