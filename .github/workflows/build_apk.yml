name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # permet de lancer manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Le depot ne contient que pubspec.yaml, lib/ et assets/.
      # On genere le dossier android/ puis on remet nos fichiers.
      - name: Generate Android scaffolding
        run: |
          if [ ! -d android ]; then
            mkdir /tmp/keep && cp -r pubspec.yaml lib assets /tmp/keep/
            flutter create --org com.teacher --project-name math_teacher --platforms android .
            cp /tmp/keep/pubspec.yaml pubspec.yaml
            rm -rf lib assets && cp -r /tmp/keep/lib lib && cp -r /tmp/keep/assets assets
            rm -rf test
          fi

      # Autorise la synthese vocale (TTS) sur Android 11+
      - name: Patch AndroidManifest for TTS
        run: |
          F=android/app/src/main/AndroidManifest.xml
          if ! grep -q "TTS_SERVICE" "$F"; then
            sed -i 's#<application#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n    <application#' "$F"
          fi
          sed -i 's#android:label="[^"]*"#android:label="Math Teacher"#' "$F"

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: math-teacher-apk
          path: build/app/outputs/flutter-apk/app-release.apk
